<section class="hero">

    <button class="hero-arrow hero-arrow-left" type="button" (click)="previousMovie()">
        <i class="bi bi-chevron-left"></i>
    </button>

    <div class="hero-card">

        @for (movie of movies; track $index) {
        <img [src]="movie.image" [alt]="movie.title" class="hero-image"
            [class.active]="$index === currentMovie()">
        }

        <div class="hero-overlay">
            <h1>{{ movies[currentMovie()].title }}</h1>

            <button class="hero-button" type="button">
                ¡Compra ya tus entradas!
            </button>
        </div>

        <div class="hero-indicators">
            @for (movie of movies; track $index) {
            <button type="button" [class.active]="$index === currentMovie()"
                (click)="currentMovie.set($index)"></button>
            }
        </div>

    </div>

    <button class="hero-arrow hero-arrow-right" type="button" (click)="nextMovie()">
        <i class="bi bi-chevron-right"></i>
    </button>

</section>
